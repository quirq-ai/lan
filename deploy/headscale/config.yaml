# Headscale config for lan. Docs: https://headscale.net/stable/ref/configuration/
# server_url and the DERP public IP come from env (HEADSCALE_SERVER_URL,
# HEADSCALE_DERP_SERVER_IPV4), set in docker-compose.yml from .env.
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
noise:
  private_key_path: /var/lib/headscale/noise_private.key
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

# Embedded DERP relay + STUN (udp/3478), so no third-party relays are used.
# https://headscale.net/stable/ref/derp/
derp:
  server:
    enabled: true
    region_id: 999
    region_code: lan
    region_name: lan relay
    verify_clients: true
    stun_listen_addr: 0.0.0.0:3478
    private_key_path: /var/lib/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
  urls: []
  auto_update_enabled: false

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true

# lan-server rewrites the ACL policy through the API, so it must live in the DB.
policy:
  mode: database

dns:
  magic_dns: true
  base_domain: lan.internal
  override_local_dns: false

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"
log:
  level: info
